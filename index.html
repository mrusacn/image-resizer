<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="清晰改图是一款在线修改图片尺寸工具，支持证件照尺寸、图片压缩到指定大小、批量处理、DPI 设置和 PNG/JPG/WebP 导出。"
    />
    <meta name="keywords" content="图片尺寸修改,在线改图,证件照尺寸,图片压缩,图片放大缩小,批量改图片" />
    <title>清晰改图 - 在线修改图片尺寸、压缩图片和证件照规格工具</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="brand">清晰改图</p>
          <h1>在线修改图片尺寸、压缩大小和证件照规格</h1>
        </div>
        <button class="ghost-button" id="resetButton" type="button" title="重新开始">
          <span aria-hidden="true">↺</span>
          重置
        </button>
      </header>

      <main class="workspace">
        <section class="preview-panel" aria-label="图片预览">
          <label class="drop-zone" id="dropZone">
            <input id="fileInput" type="file" accept="image/*" multiple />
            <span class="upload-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img">
                <path d="M12 16V5m0 0 4 4m-4-4-4 4M5 19h14" />
              </svg>
            </span>
            <strong>上传图片</strong>
            <span>支持单张或多张图片，拖到这里也可以</span>
          </label>

          <div class="compare-grid">
            <div class="compare-card">
              <div class="compare-title">原图</div>
              <div class="image-stage is-empty" id="originalStage">
                <canvas id="originalCanvas" aria-label="原图预览"></canvas>
                <p class="empty-hint" id="emptyHint">选择图片后，可以对比原图和输出效果。</p>
              </div>
            </div>
            <div class="compare-card">
              <div class="compare-title">输出预览</div>
              <div class="image-stage is-empty" id="imageStage">
                <canvas id="previewCanvas" aria-label="调整后的图片预览"></canvas>
                <p class="empty-hint">等待输出预览</p>
              </div>
            </div>
          </div>

          <div class="image-meta" id="imageMeta">
            <span>原图：--</span>
            <span>输出：--</span>
            <span>导出：--</span>
          </div>

          <div class="file-list" id="fileList" aria-label="批量图片列表"></div>
        </section>

        <aside class="controls-panel" aria-label="尺寸设置">
          <section class="control-group">
            <div class="group-heading">
              <h2>目标尺寸</h2>
              <label class="switch">
                <input id="lockRatio" type="checkbox" checked />
                <span>保持比例</span>
              </label>
            </div>

            <div class="size-grid">
              <label>
                宽度 px
                <input id="widthInput" type="number" min="1" max="12000" value="1200" />
              </label>
              <label>
                高度 px
                <input id="heightInput" type="number" min="1" max="12000" value="800" />
              </label>
            </div>

            <div class="presets" aria-label="常用尺寸">
              <button type="button" data-size="295,413" data-dpi="300">一寸照 295×413</button>
              <button type="button" data-size="413,626" data-dpi="300">二寸照 413×626</button>
              <button type="button" data-size="390,567" data-dpi="300">小二寸 390×567</button>
              <button type="button" data-size="358,441" data-dpi="350">身份证 358×441</button>
              <button type="button" data-size="600,600" data-dpi="300">护照 600×600</button>
              <button type="button" data-size="1200,1600" data-dpi="300">签证照 1200×1600</button>
              <button type="button" data-size="800,800">头像 800×800</button>
              <button type="button" data-size="1080,1080">方图 1080×1080</button>
              <button type="button" data-size="1920,1080">横版 1920×1080</button>
              <button type="button" data-size="1080,1920">竖版 1080×1920</button>
            </div>
          </section>

          <section class="control-group">
            <h2>适配与裁切</h2>
            <div class="segmented" role="group" aria-label="图片适配方式">
              <button class="is-active" type="button" data-fit="contain">完整留白</button>
              <button type="button" data-fit="cover">填满裁切</button>
              <button type="button" data-fit="stretch">拉伸铺满</button>
            </div>

            <label class="color-row">
              留白颜色
              <input id="backgroundColor" type="color" value="#ffffff" />
            </label>

            <div>
              <div class="mini-label">裁切位置</div>
              <div class="anchor-grid" id="anchorGrid" aria-label="裁切位置">
                <button type="button" data-anchor="0,0" title="左上"></button>
                <button type="button" data-anchor="0.5,0" title="上方"></button>
                <button type="button" data-anchor="1,0" title="右上"></button>
                <button type="button" data-anchor="0,0.5" title="左侧"></button>
                <button class="is-active" type="button" data-anchor="0.5,0.5" title="居中"></button>
                <button type="button" data-anchor="1,0.5" title="右侧"></button>
                <button type="button" data-anchor="0,1" title="左下"></button>
                <button type="button" data-anchor="0.5,1" title="下方"></button>
                <button type="button" data-anchor="1,1" title="右下"></button>
              </div>
            </div>
          </section>

          <section class="control-group">
            <h2>导出设置</h2>
            <div class="format-grid">
              <label>
                格式
                <select id="formatSelect">
                  <option value="image/png">PNG 无损</option>
                  <option value="image/jpeg">JPG 高质量</option>
                  <option value="image/webp">WebP</option>
                </select>
              </label>
              <label>
                DPI
                <select id="dpiSelect">
                  <option value="72">72</option>
                  <option value="96" selected>96</option>
                  <option value="150">150</option>
                  <option value="300">300</option>
                  <option value="350">350</option>
                </select>
              </label>
            </div>

            <div class="format-grid">
              <label>
                质量 <span id="qualityValue">100%</span>
                <input id="qualityRange" type="range" min="35" max="100" value="100" />
              </label>
              <label>
                压缩到
                <select id="targetSizeSelect">
                  <option value="0">不限制</option>
                  <option value="200">200KB 内</option>
                  <option value="500">500KB 内</option>
                  <option value="1024">1MB 内</option>
                  <option value="custom">自定义</option>
                </select>
              </label>
            </div>

            <label id="customSizeWrap" hidden>
              自定义大小 KB
              <input id="customSizeInput" type="number" min="20" max="20000" value="300" />
            </label>

            <div class="action-grid">
              <button class="primary-button" id="downloadButton" type="button" disabled>
                <span aria-hidden="true">⬇</span>
                导出当前
              </button>
              <button class="secondary-button" id="shareButton" type="button" disabled>
                <span aria-hidden="true">⇪</span>
                保存到相册
              </button>
              <button class="secondary-button" id="batchButton" type="button" disabled>
                <span aria-hidden="true">▣</span>
                批量 ZIP
              </button>
            </div>

            <p class="status-line" id="statusLine">图片不会上传服务器，全部在浏览器本地处理。</p>
          </section>
        </aside>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
